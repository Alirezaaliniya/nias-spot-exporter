<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
    html { zoom: 2; }
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
    body { font-family: "Pinar VF", "Pinar", Tahoma, sans-serif; color: #fff; direction: rtl;
        background: radial-gradient(420px 260px at 90% 0%, #7c3aed, transparent 70%), linear-gradient(135deg, #312e81, #4f46e5);
        display: flex; flex-direction: column; justify-content: center; padding: 0 34px; box-sizing: border-box; }
    .top { display: flex; align-items: center; gap: 14px; }
    .top img { width: 64px; height: 64px; border-radius: 16px; background: #fff; padding: 5px; box-sizing: border-box; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
    .name { font: 800 24px "Pinar VF", Tahoma, sans-serif; direction: ltr; letter-spacing: -.3px; }
    p { margin: 16px 0 18px; font-size: 18px; font-weight: 700; line-height: 1.6; }
    .chips { display: flex; gap: 7px; direction: ltr; justify-content: flex-end; }
    .chips span { font: 700 12px "Pinar VF", Tahoma, sans-serif; padding: 5px 10px; border-radius: 8px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); }
</style>
</head>
<body>
    <div class="top"><img src="../../icons/icon128.png" alt=""><div class="name">nias spot exporter</div></div>
    <p>خروجی حرفه‌ای از جلسات دوره‌ها<br>و لایسنس‌های اسپات پلیر</p>
    <div class="chips"><span>JSON</span><span>TXT</span><span>PDF</span><span>Word</span><span>Excel</span></div>
</body>
</html>
