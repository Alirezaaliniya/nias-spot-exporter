<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
    html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }
    body { font-family: "Pinar VF", "Pinar", Tahoma, sans-serif; color: #fff; direction: rtl; position: relative;
        background: radial-gradient(900px 500px at 95% -10%, #7c3aed, transparent 60%),
                    radial-gradient(700px 500px at 30% 120%, #2563eb, transparent 60%),
                    linear-gradient(135deg, #312e81, #4f46e5); }
    .text { position: absolute; right: 70px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
    .top { display: flex; align-items: center; gap: 16px; }
    .top img { width: 76px; height: 76px; border-radius: 18px; background: #fff; padding: 6px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .name { font: 800 30px "Pinar VF", Tahoma, sans-serif; direction: ltr; }
    h1 { margin: 26px 0 12px; font-size: 38px; line-height: 1.45; font-weight: 800; }
    p { margin: 0 0 24px; font-size: 19px; opacity: .88; line-height: 1.8; }
    .chips { display: flex; gap: 8px; direction: ltr; justify-content: flex-end; }
    .chips span { font: 700 14px "Pinar VF", Tahoma, sans-serif; padding: 6px 13px; border-radius: 9px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); }
    .shot { position: absolute; left: 70px; top: 60px; width: 700px; height: 560px; border-radius: 16px 16px 0 0; overflow: hidden;
        box-shadow: 0 30px 80px rgba(15,10,60,.55), 0 0 0 1px rgba(255,255,255,.25); background: #fff; }
    .shot { direction: ltr; }
    .shot iframe { border: 0; width: 1400px; height: 1000px; transform: scale(.5); transform-origin: top left; }
</style>
</head>
<body>
    <div class="text">
        <div class="top"><img src="../../icons/icon128.png" alt=""><div class="name">nias spot exporter</div></div>
        <h1>فهرست جلسات و لایسنس‌ها،<br>مرتب و آماده‌ی خروجی</h1>
        <p>استخراج خودکار از پنل اسپات پلیر، ویرایش روی بوم طراحی<br>و خروجی در قالب دلخواه — همه داخل مرورگر شما</p>
        <div class="chips"><span>JSON</span><span>TXT</span><span>PDF</span><span>Word</span><span>Excel</span></div>
    </div>
    <div class="shot"><iframe src="editor.html#editor2"></iframe></div>
</body>
</html>
